name: 🐞 Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le problème en détail. Pour les vulnérabilités
        de sécurité : **pas ici** — voir `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce + expected vs actual behavior
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (FastAPI)
        - Frontend (React)
        - Dashboard / stats
        - Sales / caisse
        - Tickets import
        - Wave payment / QR
        - Backups / scheduler
        - Installation (install-ubuntu.sh / Docker)
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: journalctl --user -u advens-manager, browser console… Remove any personal data first.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: main @ <sha>
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
        - label: I redacted secrets and customer data
