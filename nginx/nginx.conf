events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Empêcher de deviner la version et réduire la surface
    server_tokens off;

    # Taille max des uploads (QR Wave, fichiers) — sinon nginx rejette en 413 à 1 Mo par défaut
    client_max_body_size 25m;

    # En-têtes de sécurité au niveau http. ATTENTION règle nginx : un `add_header`
# déclaré dans un location ERASE tous les en-têtes hérités du bloc parent —
# donc les locations qui ajoutent leur propre add_header les répètent.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # === Rapports PDF / Excel — téléchargement de fichiers binaires ===
        location /api/reports/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass_header Content-Disposition;
            proxy_pass_header Content-Type;
            proxy_pass_header Content-Length;
            proxy_max_temp_file_size 0;
        }

        # === Téléchargement des fichiers backup (admin) ===
        location /api/settings/backups {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_pass_header Content-Disposition;
            proxy_pass_header Content-Type;
        }

        # Uploaded files — l'API sert désormais via /api/uploads/ AUTHENTIFIÉ.
        # Jamais de /uploads public.
        location /uploads/ {
            return 404;
        }

        # API docs — bloqué : cartographie complète de l'API sinon.
        location /docs {
            return 404;
        }

        location /openapi.json {
            return 404;
        }

        # API requests
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend — répéter les en-têtes : add_header d'un location ERASE
        # tous les add_header hérités (règle nginx : add_header dans un location efface l'héritage).
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # HTTPS server (Production only)
    # Uncomment when using Let's Encrypt certificates
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #
    #     # ... same location blocks as above ...
    # }
}
